name: Deploy Astro site

on:
  push:
    branches:
      - staging
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  staging:
    name: Build and deploy staging
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build staging site
        env:
          DEPLOY_ENV: staging
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=staging
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  production:
    name: Build and deploy production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      PRODUCTION_PATH: ${{ secrets.PRODUCTION_PATH }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        env:
          DEPLOY_ENV: production
        run: npm run build

      - name: Validate production deployment settings
        run: |
          for value in SSH_HOST SSH_USER SSH_PORT SSH_PRIVATE_KEY PRODUCTION_PATH; do
            if [ -z "${!value}" ]; then
              echo "Required secret is missing: $value" >&2
              exit 1
            fi
          done

          case "$SSH_PORT" in
            *[!0-9]*|'')
              echo "SSH_PORT must contain only digits." >&2
              exit 1
              ;;
          esac

          case "$PRODUCTION_PATH" in
            /*) ;;
            *)
              echo "PRODUCTION_PATH must be an absolute path." >&2
              exit 1
              ;;
          esac

          if [ "$PRODUCTION_PATH" = "/" ]; then
            echo "PRODUCTION_PATH must not be the server root directory." >&2
            exit 1
          fi

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to production with rsync
        run: |
          rsync -avzc \
            --exclude='.DS_Store' \
            -e "ssh -i ~/.ssh/id_rsa -p $SSH_PORT -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            dist/ \
            "$SSH_USER@$SSH_HOST:$PRODUCTION_PATH/"
